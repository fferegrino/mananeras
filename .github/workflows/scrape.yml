name: Scrape information

on:
  workflow_dispatch:
    inputs:
      source:
        description: Where to read the current dataset from
        type: choice
        options: [huggingface, kaggle]
        default: huggingface
  schedule:
  - cron: "20 19 * * *"

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  Scrape:

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v7

    - uses: fferegrino/dataset-sync/fetch@v1
      with:
        # Scheduled runs have no inputs, so they always read from Hugging Face.
        from: ${{ inputs.source || 'huggingface' }}
        huggingface-dataset: feregrino/mananeras
        kaggle-dataset: ioexception/mananeras
        kaggle-username: ioexception
        kaggle-key: ${{ secrets.KAGGLE_KEY }}

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install --upgrade pip==25.2
        pip install poetry==2.2.1
        poetry config virtualenvs.create false --local
        poetry install

    - name: Install Playwright Chromium
      run: poetry run playwright install chromium --with-deps

    - name: Execute workload
      run: python -m mananeras

    # A transcript is written once and never changed, so any rewrite is a bug.
    - uses: fferegrino/dataset-sync/publish@v1
      with:
        append-only: "*.txt"
        huggingface-dataset: feregrino/mananeras
        huggingface-card: dataset-card.md
        kaggle-dataset: ioexception/mananeras
        kaggle-metadata: dataset-metadata.json
        huggingface-token: ${{ secrets.HF_TOKEN }}
        kaggle-username: ioexception
        kaggle-key: ${{ secrets.KAGGLE_KEY }}
        healthcheck-url: ${{ secrets.HEALTHCHECK_URL }}

    # A failure before publish skips it, and with it publish's own failure ping.
    - uses: fferegrino/dataset-sync/ping@v1
      if: failure()
      with:
        url: ${{ secrets.HEALTHCHECK_URL }}
        status: fail
